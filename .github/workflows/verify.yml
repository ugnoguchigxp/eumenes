name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EUMENES_API_TOKEN: ci-api-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install and measure preparation
        run: |
          bun -e '
            const started = performance.now();
            const child = Bun.spawn([process.execPath, "install", "--frozen-lockfile"], { stdout: "inherit", stderr: "inherit" });
            const exitCode = await child.exited;
            await Bun.write("verification-reports/preparation.json", JSON.stringify({ schemaVersion: 1, os: process.platform, bun: Bun.version, ms: Math.round(performance.now() - started), exitCode, includes: "install and postinstall" }, null, 2));
            process.exit(exitCode);
          '
      - run: bun run verify:all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            verification-reports/preparation.json
            verification-reports/latest.json
            verification-reports/runs/**/report.json
            verification-reports/runs/**/inventory.json
            verification-reports/runs/**/selection.json
          retention-days: 7
          if-no-files-found: ignore
