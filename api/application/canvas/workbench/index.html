<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Canvasアプリ</title>
		<link rel="stylesheet" href="./app.css" />
		<script type="module" src="./app.js"></script>
	</head>
	<body>
		<main
			id="preview-host"
			class="preview-host mode-frame"
			aria-label="Canvasアプリ"
		>
			<div
				id="preview-frame"
				class="frame"
				role="region"
				aria-label="作品プレビュー"
			></div>
			<div class="empty">
				<p>作品を開く</p>
				<button type="button" popovertarget="library">作品一覧と版履歴</button>
			</div>
			<header class="workbench-header">
				<div class="caption">
					<strong id="current">新規の作品</strong>
					<span id="preview-label"></span>
				</div>
				<button
					class="icon-button floating"
					type="button"
					popovertarget="conversation"
					aria-label="Canvasの会話"
					title="Canvasの会話"
				>
					<svg aria-hidden="true" viewBox="0 0 24 24">
						<path
							d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"
						/>
					</svg>
				</button>
			</header>
			<div class="toolbar floating" role="group" aria-label="Canvasの操作">
				<button
					class="icon-button"
					type="button"
					popovertarget="library"
					aria-label="作品と版履歴"
					title="作品と版履歴"
				>
					<svg aria-hidden="true" viewBox="0 0 24 24">
						<circle cx="12" cy="12" r="9" />
						<path d="M12 7v5h4" />
					</svg>
				</button>
				<div class="toolbar-group">
					<button
						class="icon-button"
						type="button"
						id="restart"
						aria-label="再実行"
						title="再実行"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M3 12a9 9 0 1 1 2.6 6.4M3 4v8h8" />
						</svg>
					</button>
					<button
						class="icon-button"
						type="button"
						id="stop"
						aria-label="停止"
						title="停止"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<rect x="6" y="6" width="12" height="12" rx="2" />
						</svg>
					</button>
				</div>
				<div class="toolbar-group">
					<button
						class="icon-button"
						type="button"
						data-mode="fill"
						aria-label="ブラウザいっぱい"
						aria-pressed="false"
						title="ブラウザいっぱい"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<rect x="3" y="4" width="18" height="16" rx="2" />
							<path d="M3 8h18" />
						</svg>
					</button>
					<button
						class="icon-button"
						type="button"
						data-mode="fullscreen"
						aria-label="全画面"
						aria-pressed="false"
						title="全画面"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
						</svg>
					</button>
					<button
						class="icon-button"
						type="button"
						id="exit-mode"
						aria-label="Artifact表示に戻る"
						title="Artifact表示に戻る"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M3 8h5V3m13 5h-5V3M3 16h5v5m13-5h-5v5" />
						</svg>
					</button>
				</div>
			</div>
			<section
				id="library"
				class="panel"
				popover
				aria-labelledby="library-title"
			>
				<header class="panel-head">
					<h2 id="library-title">作品</h2>
					<button
						class="icon-button"
						type="button"
						popovertarget="library"
						popovertargetaction="hide"
						aria-label="作品一覧を閉じる"
						title="作品一覧を閉じる"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="m6 6 12 12M18 6 6 18" />
						</svg>
					</button>
				</header>
				<div class="row">
					<button id="new-artwork" type="button">新規</button>
					<button id="refresh-artworks" type="button">一覧を更新</button>
				</div>
				<div id="artworks-status" role="status"></div>
				<ul id="artworks" aria-label="作品一覧"></ul>
				<h2>版の履歴</h2>
				<div id="restore-status" role="status"></div>
				<div id="revisions-status" role="status"></div>
				<ol id="revisions" aria-label="版の履歴"></ol>
			</section>
			<section
				id="conversation"
				class="panel"
				popover
				aria-labelledby="conversation-title"
			>
				<header class="panel-head">
					<h2 id="conversation-title">Canvasの会話</h2>
					<button
						class="icon-button"
						type="button"
						popovertarget="conversation"
						popovertargetaction="hide"
						aria-label="Canvasの会話を閉じる"
						title="Canvasの会話を閉じる"
					>
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="m6 6 12 12M18 6 6 18" />
						</svg>
					</button>
				</header>
				<ol id="messages"></ol>
				<form id="composer" method="dialog">
					<textarea
						id="message"
						rows="3"
						aria-label="依頼"
						placeholder="例：この作品にスコア表示を追加して"
					></textarea>
					<div class="row">
						<button id="send" type="submit">送信</button>
						<button id="cancel" type="button" disabled>取消</button>
					</div>
				</form>
			</section>
			<div class="activity">
				<div id="run-status" role="status"></div>
				<div id="preview-error" class="preview-error" role="alert" hidden>
					<p id="preview-error-text"></p>
					<button id="preview-retry" type="button">再接続</button>
				</div>
				<div id="page-warning" class="page-warning" role="alert" hidden></div>
				<div id="notice" role="status"></div>
				<section id="candidate" class="candidate" aria-label="保存候補" hidden>
					<div>
						<strong>候補</strong> <span id="cand-title"></span>
						<code id="cand-digest"></code>
					</div>
					<div id="cand-changes"></div>
					<ul id="cand-checks"></ul>
					<div id="cand-review" hidden>
						<div id="cand-review-head"></div>
						<ul id="cand-requirements" aria-label="要件ごとの判定"></ul>
						<ul id="cand-findings" aria-label="検証の指摘"></ul>
					</div>
					<div id="cand-unconfirmed"></div>
					<button id="save" type="button">保存</button>
					<span id="save-status" role="status"></span>
				</section>
			</div>
		</main>
	</body>
</html>
