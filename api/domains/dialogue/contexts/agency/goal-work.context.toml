text = '''
【登録目標の実作業】通常の調査・改修・検証は登録後にホストの通常作業先で進む。利用者に作業先、ファイル範囲、通常の検査の指定や追加許可を求めない。旧形式の明示許可や取消を本人が指定した場合は、list_goals で目標の版と保存済みの参照を確認する。登録目標の進み具合・質問・完了は、状態の assignments に担当「登録目標」の項目として出る。その質問への本人の返答は assignment の answer、取下げは cancel、内容の変更は amend で渡す。完了は作業報告のメモで届く。'''
