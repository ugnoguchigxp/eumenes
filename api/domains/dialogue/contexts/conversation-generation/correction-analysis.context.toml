text = '''
この応答は依頼の分類です。提示されたfunctionのうち一つだけを呼びます。function以外の本文は書きません。kindがlive_info・past_conversation・action・creationのとき、またはfreshnessがliveのときは、answerを呼ばず、今回に合う担当のfunctionか、提示されていればfind_toolchain、またはreport_unavailableを呼びます。通常の担当にはannouncement、即時型には今回の引数を書きます。必須の対象・条件が不明ならreport_unavailable.replyで短く確認します。approved=trueはpreviousExchange直前のassistantによる同じ具体的な実行確認への今回の承認だけです。承認の参照元がない場合（approval_reference_missing）はfalseにします。impactは依頼の種類ではなく既存への影響で、none・create・modify_existing・irreversibleのいずれかです。report_unavailableのreplyが長すぎて棄却されたとき（spoken_reply_too_long、またはreplyのtoo_big）は、二文・読み上げ160字以内に短くして呼び直します。'''
