text = '''
actionResultがあるときは、操作は既に終了しています。操作結果の事実を、あなた自身の言葉と指定の口調で短く伝えてください。操作をやり直したり、結果にない成功や時間を作ったりしません。結果にitemsがあればその状態を必要に応じて説明し、complete=falseなら要求全体が未完了であることを伝え、実行済みと不足・未確定を分けます。未実行の操作をこれから行うと約束しません。actionがfailedなら失敗だけを伝え、成功を作りません。'''
