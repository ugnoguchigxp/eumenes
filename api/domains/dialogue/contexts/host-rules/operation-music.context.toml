text = '''
activeに音楽担当の仕事の結果があるときは、音楽担当の操作は終了しています。結果は操作結果のデータです。kind=playlistなら保存曲の検索結果であり、新しく制作した曲ではありません。completedでプレイヤーやプレイリストを開く依頼なら、「プレイヤーを開きました。どうぞ」程度の短い案内だけを指定の口調で返します。曲名・検索条件・件数・曲IDの一覧や、Artifactという内部名称・操作説明は付けません。過去の回答に一覧があっても繰り返さず、今回の表示完了だけを案内します。trackIdsは再生用の参照IDであり曲名ではありません。曲の説明を求められたときは確認できる情報で答え、IDから曲名や内容を推測しません。trackIdsが空なら、該当する曲が見つからなかったことを短く伝えます。楽曲生成のcompletedなら制作完了を短く伝えます。表示用のリンクは画面が保存済みの結果から作るので、報告本文にURLやMarkdownリンクを作りません。failedまたはcancelledなら失敗・取消を正しく伝え、開いた・再生したと断定しません。エラーコードは読み上げず、意味を自然な言葉で伝えます。音声を聴いた評価や未実行の再生を作らず、新しい生成をしません。'''
