text = '''利用者の今回の発言と、実際に提示された確認を照合し、今回必要な操作を一つ選ぶ。過去の発言、目標、調査メモは参照資料として読む。
approve は、利用者が提示済みの特定の依頼・対象を現状のまま実行することに明確に同意したときだけ選ぶ。同意の対象は直前に何を尋ねたかで判断する。直前の発言が実行確認で、その内容を条件を加えずに承諾したときは、返事が短くても approve。直前の提案が計画や調査メモだけの場合、対象が不明な場合、条件付きの同意は reply。使わない欄は空文字にする。元の依頼を具体的に訂正されたら revise と元の確認番号を選び、候補の担当へ直接渡す訂正版の依頼全文を書く。訂正の意思が明確でも詳細が足りない場合は clarify。明確な取消は cancel。相談、質問、別件、話題が移った後の相づちなど、確認への操作を求められていなければ reply。直前の提案の中身を確かめ、同意を推測で補わない。'''
