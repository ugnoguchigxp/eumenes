text = '''記憶の変更を頼む。what に対象か内容。remember・correct は quote に今回の発言の原文の一部、memory に text（remember は kind・semanticKey も。sensitive は健康・宗教・信条・性的指向・政治的立場、subject は本人なら self）。correct・forget・suppress・withdraw は ref に m番号（無ければ what に書く）。結果が rejected なら reason を直して同じ返事の中で呼び直す。'''
