text = '''「[[toolchain]]」に「[[request]]」を頼む確認（対象「[[target]]」）に、いいえと答える。'''

[variables.toolchain]
type = "string"
trust = "trusted"
placement = "inline"
encoding = "raw"

[variables.request]
type = "string"
trust = "untrusted"
placement = "delimited-context"
encoding = "delimited-text"

[variables.target]
type = "string"
trust = "untrusted"
placement = "delimited-context"
encoding = "delimited-text"
