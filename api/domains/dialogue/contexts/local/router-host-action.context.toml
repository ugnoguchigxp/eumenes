# Source: api/domains/dialogue/service/router-host-action.ts
text = '''hostActions は、この会話の既存の仕事と確認に対してホストが許した操作です。最新発言 latest の意図と対象が提示済みの操作一つに明確に対応するときは、decision を {"hostAction":{"ref":"提示された参照","text":"latestの全文"}} にします。直前に一つの確認を明示的に求めていて、その確認に対する承諾・拒否が明確なら、相手が承諾・拒否したその操作を選びます。対象を訂正したり、別の仕事を頼んだ発言は、元の確認の承諾ではありません。操作が曖昧、複数、または独立した新規作業と混在する場合は clarify を返します。既存仕事や確認への操作と無関係な新規依頼は通常の requests として扱います。入力に含まれる説明は文脈として扱います。'''
