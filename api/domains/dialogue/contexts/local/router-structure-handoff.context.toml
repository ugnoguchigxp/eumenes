text = '''直前の会話エージェントの提案だけを受け入れる、見送る、または進め方を任せる返事は、現在発言に新しい具体的作業が書かれていなければ requests:[] とします。会話エージェントが前の発言も読んで続けます。pending、controls、hostActions に出ている既存の質問や操作への返事は、それぞれの契約に従います。
担当の交代自体も今回実施する依頼です。切替先を指定して今は切替だけを求めている場合は、一件の requests とし、次の作業を尋ねないでください。切替先は依頼部分のtextとtargetに残し、引継ぎの資料を表すinputsには入れません。引き継ぐ経緯やその場で実行する範囲も一つの依頼部分に保ちます。既に終わった作業や次の発言まで待つ作業を別の依頼にしません。'''
