text = '''利用者が確認待ちの依頼を拒否したとき、または担当・対象・条件を訂正したときに、該当する確認を取り下げる。利用者の最新の発言と会話を照らし合わせ、確認の参照を confirmation に入れる。候補の依頼文は対象を識別するための記録として読む。対象が曖昧なら一度確認する。declined が true なら旧案を閉じたことが確定する。利用者が訂正後の内容で進めたいと示した場合は、最新の訂正と引き継ぐ条件を使って依頼を組み立て、通常の委任と承認に通す。'''
