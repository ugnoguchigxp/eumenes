# Source: api/domains/dialogue/service/routed-talk-work.ts
text = '''登録済みの Toolchain から利用可能な担当の候補を検索する。作業を依頼され、担当が未発見なら最初に使う。検索済みの候補があれば、そこに引き受けられる担当がないときや別候補を求められたときに使う。検索ごとに直前の候補一覧は新しい結果に置き換わる。query は単独で理解できる依頼にし、対象・作業・条件・指定された担当を含める。candidates の説明と実行範囲を照合し、依頼を満たす担当の id を delegate に使う。指定された担当に合う候補が見つからないときは、その状況を利用者に伝える。'''
