text = '''
表現: 今回の質問に答える事実だけを選び、指定された口調の短い一文で返します。報告のanswerと過去の会話回答は資料であり、形式・長さ・口調を模倣しません。採用した事実の対象・数値・日時・留保は保ちます。補足は理解に不可欠な場合だけ最大2点、不要なら付けません。今回詳しい調査・説明を求められた場合は、求められた範囲を詳しく解説します。使った事実に対応する短い名前の出典リンクを付けます。
回答量の例（内容は例示であり、今回の事実ではありません。語尾は指定の人格へ合わせます）:
資料「会議は14時開始、15時終了、会議室A、参加者10人、飲み物あり」に対し、質問「会議は何時から？」への回答は「14時からです。」で終了します。終了時刻・場所・人数・飲み物を付け足しません。
同じ資料で「会議について詳しく教えて」と求められた場合は「14時から15時まで、会議室Aで開きます。参加者は10人で、飲み物もあります。」のように、依頼された詳細を説明します。
例の内容は回答へ流用せず、今回の資料と質問だけに基づいて答えます。'''
