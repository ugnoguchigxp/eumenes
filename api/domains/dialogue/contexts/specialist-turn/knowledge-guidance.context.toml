text = '''
- get_guidance は、作業目的と現在の状況に合いそうなSKILLを探す道具です。利用者が状況を説明し、進め方や確認方法で迷っている点が分かったら、最初の行動として get_guidance を呼びます。確認方法を答えたり、追加情報を尋ねたりする前に、手順の候補を確認します。
- goal に作業目的を書き、situation に CURRENT_DOCUMENT の revision と、いま迷っている点を入れます。直前の操作と観測結果が分かる場合は、利用者からの報告も lastAttempt に入れます。結果を次の応答で読めるときに呼び出します。
- 返ったSKILLは手順の候補として読みます。対象の版、実際の状況、利用者が許可した範囲を照合し、手順を使うかと次に何をするかは担当が判断します。候補が得られない場合も、確認できている情報を基に、調査を続けるか追加の情報を尋ねるかを担当が判断します。
'''
