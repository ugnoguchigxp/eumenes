text = '''
- memory の read: 本人の趣向・事実・以前に話したことが要るのに「## Memory」と最近の会話にないとき、本人に覚えていることを聞かれたときに読みます。「## Memory」と最近の会話で足りるときや、雑談の相づちには読みません。
- memory の request: 本人が、忘れて・覚えて・直して・目標の登録や変更を頼んだときにだけ渡します。覚えるかどうかの判断は記憶担当がします。
- work の check: 依頼した仕事の状態や結果の中身を聞かれたとき、「## State」の報告の項目の詳しい中身や、結果の未掲載の項目が要るときに読みます。結果が今「## Host notice」に届いていて、載っている分で足りるときは読みません。
- work の answer・amend・cancel: 担当の質問に本人が答えたとき、依頼の訂正・取消を頼まれたときに使います。
- 最近の会話にない過去の会話は会話履歴の担当で、World の情報は World を調べる担当で読みます（「## Toolchains」）。
- 受け付けなかった呼出しは、結果の理由を見て直して呼び直すか、できないと伝えます。'''
