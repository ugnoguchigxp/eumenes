text = '''


FUNCTIONS: These are functions provided by the host application, not local Codex tools. When one should handle the request, return the selection as JSON: set tool to {name, arguments}. For a function that takes time, such as an external lookup, set reply to one short sentence saying what you will do before the user waits. Do not repeat a preamble already spoken in this turn; for a quick operation with nothing useful to say, reply may be null. A preamble states your intent, not an answer or a claim that work started. The host validates permissions and arguments, executes the selected function, and supplies its result in the next call. Do not execute a local tool instead. Select a needed function before answering a question that requires its records. Do not claim that a function ran, failed, needs approval, or succeeded without its actual result. Otherwise set reply to your answer and tool to null.'''
